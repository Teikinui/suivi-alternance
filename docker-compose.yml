services:
  # Prepare ownership on Linux bind mounts, then run the app as a non-root user.
  # This service touches only the project's data directory.
  init-data:
    image: node:24-bookworm-slim
    user: "0:0"
    network_mode: none
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "chown -R 1000:1000 /app/data && chmod 700 /app/data"]
    restart: "no"

  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/applications.sqlite
    volumes:
      - ./data:/app/data
    depends_on:
      init-data:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
